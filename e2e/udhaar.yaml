# Journey 3: lend 10,000, get 3,000 back → "You will get ₹7,000"; getting 8,000 more
# would flip the balance, so the flip warning appears (AC-09, AC-13).
appId: com.shivambgs15.hisaab.dev
name: Udhaar balance and flip warning
---
- runFlow: common/fresh-start.yaml
# Nobody exists yet, so "I gave" opens the Add person form first.
- tapOn: 'I gave'
- tapOn: 'Name'
- inputText: 'Rahul'
- scrollUntilVisible:
    element: 'Save'
- tapOn: 'Save'
- inputText: '10000'
- scrollUntilVisible:
    element: 'Save'
- tapOn: 'Save'
- assertVisible: 'You will get ₹10,000, from 1 person'
# From now on "I got" shows the person picker.
- tapOn: 'I got'
- tapOn: 'Rahul'
- inputText: '3000'
- scrollUntilVisible:
    element: 'Save'
- tapOn: 'Save'
- assertVisible: 'You will get ₹7,000, from 1 person'
- tapOn: 'I got'
- tapOn: 'Rahul'
- inputText: '8000'
- scrollUntilVisible:
    element: 'Save'
- tapOn: 'Save'
- assertVisible: 'Check this amount'
- tapOn: 'Change amount'
